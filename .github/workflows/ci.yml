name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Feedback Worker and the agent-fix patch validator live outside the
      # npm workspace, so npm test does not cover them.
      - run: node --test worker/feedback/index.test.js .github/fixer/validate-patch.test.js
