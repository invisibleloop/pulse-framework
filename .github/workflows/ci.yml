name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # engines is >=22. Some behaviour differs by Node version (pipeline() throws on a
    # destroyed stream from 24), so run the lowest supported and a newer one.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AGENTS.md is a copy of CLAUDE.md for other agent tools; edit CLAUDE.md, then copy.
      - name: AGENTS.md is an exact copy of CLAUDE.md
        run: |
          if ! cmp -s CLAUDE.md AGENTS.md; then
            echo "::error file=AGENTS.md::AGENTS.md has drifted from CLAUDE.md. Run: cp CLAUDE.md AGENTS.md"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Feedback Worker and the agent-fix patch validator live outside the
      # npm workspace, so npm test does not cover them.
      - run: node --test worker/feedback/index.test.js .github/fixer/validate-patch.test.js .github/fixer/key-proxy.test.js
