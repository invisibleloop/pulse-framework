name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Runs the repo's own code (npm ci, the test suite) with a read-only token and no
  # stored credentials, so nothing executed here can push or publish.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same typecheck CI runs: a release must not go out with broken type declarations.
      - run: npm run typecheck

      - run: npm test

  # Bumps the version, pushes it to main and publishes. Pushing to main needs the
  # ruleset's admin bypass, which a personal repo can only grant to a person, so
  # RELEASE_PAT is a fine-grained token (this repo only, Contents: read/write, short
  # expiry). It is exposed to ONE step, a bare `git push`; no repo code, tests or
  # install scripts run while it is set. npm publish uses OIDC, not a token.
  release:
    needs: test
    runs-on: ubuntu-latest
    # Releases queue instead of racing each other for the version number.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: release-version.js reads every commit since the last release, and filters
          # them by path. In a shallow clone the oldest commit looks like it added every file, so
          # the filter matched always and docs-only merges still published a release.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Install an npm that supports trusted publishing
        run: npm install -g npm@11

      - name: Bump the version from conventional commits and commit it
        id: bump
        run: |
          cd packages/pulse
          VERSION=$(node scripts/release-version.js)
          # No version means no commit touched the package since the last release (docs-only,
          # CI-only or root-only merge): skip the rest of the job instead of republishing it.
          if [ -z "$VERSION" ]; then
            echo "Nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fallback: if this exact version is somehow already on npm, bump patch
          while npm view @invisibleloop/pulse@$VERSION version 2>/dev/null | grep -q .; do
            VERSION=$(node -e "const [a,b,c]='$VERSION'.split('.').map(Number);console.log(a+'.'+b+'.'+(c+1))")
          done
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "$VERSION" > public/.pulse-ui-version
          cd ../..
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/pulse/package.json package-lock.json packages/pulse/public/.pulse-ui-version
          git commit -m "chore: release $VERSION [skip ci]" || true
          git pull --rebase

      # The only step that sees the token, and it runs nothing but git.
      - name: Push the release commit to main
        if: steps.bump.outputs.skip != 'true'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          REPO:        ${{ github.repository }}
        run: git push "https://x-access-token:${RELEASE_PAT}@github.com/${REPO}.git" HEAD:main

      # No npm token here on purpose: `npm publish` authenticates with the OIDC
      # identity of this workflow (permissions.id-token), configured as a trusted
      # publisher for @invisibleloop/pulse on npmjs.com.
      - name: Publish to npm
        if: steps.bump.outputs.skip != 'true'
        run: |
          cd packages/pulse
          npm publish --provenance --access public

      # Tag the release commit and publish a GitHub Release with notes generated from
      # the merged PR titles since the previous tag. Only runs after npm publish
      # succeeded, so a tag always means "this version shipped".
      - name: Create the GitHub Release
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/pulse/package.json').version")
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "v$VERSION" --generate-notes --latest
