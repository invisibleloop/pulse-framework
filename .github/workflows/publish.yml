name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Install an npm that supports trusted publishing
        run: npm install -g npm@11

      # No npm token here on purpose: `npm publish` authenticates with the OIDC
      # identity of this workflow (permissions.id-token), configured as a trusted
      # publisher for @invisibleloop/pulse on npmjs.com.
      - name: Bump version from conventional commits, then publish
        run: |
          cd packages/pulse
          VERSION=$(node scripts/release-version.js)
          # Fallback: if this exact version is somehow already on npm, bump patch
          while npm view @invisibleloop/pulse@$VERSION version 2>/dev/null | grep -q .; do
            VERSION=$(node -e "const [a,b,c]='$VERSION'.split('.').map(Number);console.log(a+'.'+b+'.'+(c+1))")
          done
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "$VERSION" > public/.pulse-ui-version
          cd ../..
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/pulse/package.json package-lock.json packages/pulse/public/.pulse-ui-version
          git commit -m "chore: release $VERSION [skip ci]" || true
          git pull --rebase
          git push
          cd packages/pulse
          npm publish --provenance --access public

      # Tag the release commit and publish a GitHub Release with notes generated from
      # the merged PR titles since the previous tag. Only runs after npm publish
      # succeeded, so a tag always means "this version shipped".
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/pulse/package.json').version")
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "v$VERSION" --generate-notes --latest
