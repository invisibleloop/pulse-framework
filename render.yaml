services:
  - type: web
    name: pulse-docs
    env: node
    plan: free
    buildCommand: npm install && cd docs && npm install --no-save
    startCommand: cd docs && npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      # Pins canonical links to the real domain instead of trusting forwarded headers.
      - key: SITE_ORIGIN
        value: https://pulseframework.dev
