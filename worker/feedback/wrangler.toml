name = "pulse-feedback"
main = "index.js"
compatibility_date = "2026-10-01"

# Production is served from feedback.pulseframework.dev (custom domain, set in the
# Cloudflare dashboard). Turn the public workers.dev URL off so it cannot be used
# to bypass rules on the custom domain.
workers_dev = false
preview_urls = false

[vars]
REPO = "invisibleloop/pulse-framework"

# Per-IP limit: 5 reports per minute. The binding only supports 10 or 60 second
# windows; a tighter hourly/daily cap needs a Cloudflare WAF rate-limit rule.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Burst dedupe (created with: npx wrangler kv namespace create FINGERPRINTS)
[[kv_namespaces]]
binding = "FINGERPRINTS"
id = "2b568a9baaaf4b989f949982f5e24e32"

# Secret (not stored here):  npx wrangler secret put GITHUB_TOKEN
